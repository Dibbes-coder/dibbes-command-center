<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Tempo Chess Counsel</title><style>
:root{--bg:#f3eee6;--card:#fffdf8;--ink:#15110d;--muted:#74675a;--line:#e5d8c7;--br:#9b704a;--iv:#f3ead5;--blue:#246bea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#f8f3eb,#eee5d9);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:var(--ink)}button,select{font:inherit}.app{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 28px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.ey{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:5px}h1{font-size:32px;line-height:.98;letter-spacing:-.055em;margin:0;font-weight:900}.sub{margin:7px 0 0;color:var(--muted);font-size:14px}.ready{border:1px solid var(--line);background:#fffaf3;border-radius:999px;padding:8px 12px;height:34px;color:#6d4b2b;font-weight:800;font-size:12px}.card{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 50px rgba(75,51,32,.08);overflow:hidden;margin-bottom:14px}.shell{padding:12px}#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid rgba(50,32,18,.14)}.sq{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1;user-select:none}.l{background:var(--iv)}.d{background:var(--br)}.sq:after{content:attr(data-c);position:absolute;left:4px;bottom:3px;font-size:10px;font-weight:800;opacity:.3}.d:after{color:#fff;opacity:.4}.pc{font-family:Georgia,serif;font-size:clamp(33px,9.5vw,59px);line-height:1;transform:translateY(-1px)}.wp{color:#fff7e8;-webkit-text-stroke:.35px rgba(77,46,21,.36);text-shadow:0 1px 0 #fff,0 7px 13px rgba(50,28,10,.25)}.bp{color:#201610;text-shadow:0 1px 0 rgba(255,255,255,.12),0 7px 13px rgba(0,0,0,.2)}.sel{box-shadow:inset 0 0 0 4px var(--blue)}.fr{box-shadow:inset 0 0 0 4px rgba(20,15,10,.7)}.to{box-shadow:inset 0 0 0 4px var(--blue)}.status{padding:0 15px 15px;color:var(--muted);font-size:14px}.status b{color:var(--ink)}.sec{padding:16px}.label{margin:0 0 10px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:var(--muted)}.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.pb,.ghost,.go,select{border:1px solid var(--line);border-radius:17px;background:#fffdf8;color:var(--ink)}.pb{height:52px;font-size:27px}.pb.on{border-color:#b98a5e;background:#f6ede3}.rm{grid-column:span 2;font-size:15px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.ghost,select{height:50px;padding:0 13px;font-weight:750;font-size:15px}.go{height:62px;width:100%;margin-top:12px;background:linear-gradient(#211913,#11100e);color:#fff;font-size:20px;font-weight:900;border-color:#17120d}.resTop{padding:18px 16px 15px;background:linear-gradient(#fbf5ec,#f4e8d8);border-bottom:1px solid var(--line)}.rlabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#795634;font-weight:850;margin-bottom:5px}#best{font-size:48px;line-height:1;font-weight:950;margin-bottom:8px}.meta{color:var(--muted);font-size:14px}.why{padding:15px 16px 17px;font-size:15px;line-height:1.48;color:#3b332b}.why ul{margin:0;padding-left:20px}.foot{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0}@media(max-width:390px){h1{font-size:29px}.pal{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class='app'><div class='top'><div><div class='ey'>premium phone prototype</div><h1>Tempo Chess Counsel</h1><p class='sub'>Set the board. Tap analyze. Get one best move.</p></div><div class='ready'>ready</div></div><section class='card'><div class='shell'><div id='board'></div></div><div class='status' id='status'><b>Ready.</b> Tap a piece on the board to pick it up.</div></section><section class='card'><div class='sec'><p class='label'>Set board</p><div class='pal' id='pal'></div><div class='grid'><button class='ghost' id='start'>Starting position</button><button class='ghost' id='empty'>Empty board</button></div><div class='grid'><button class='ghost' id='undo'>Undo</button><button class='ghost' id='flip'>Flip board</button></div><div class='grid'><select id='turn'><option value='w'>White to move</option><option value='b'>Black to move</option></select><button class='ghost' id='clearSel'>Clear selection</button></div><button class='go' id='calc'>Calculate best move</button></div></section><section class='card'><div class='resTop'><div class='rlabel'>Best move</div><div id='best'>-</div><div class='meta' id='meta'>No calculation yet.</div></div><div class='why' id='why'>One answer only. No move menu.</div></section><div class='foot'>Tap piece → tap destination. Undo is available.</div></main><script>
(()=>{const G={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'},V={P:100,N:320,B:330,R:500,Q:900,K:0},F='abcdefgh'.split(''),START={a1:'wR',b1:'wN',c1:'wB',d1:'wQ',e1:'wK',f1:'wB',g1:'wN',h1:'wR',a2:'wP',b2:'wP',c2:'wP',d2:'wP',e2:'wP',f2:'wP',g2:'wP',h2:'wP',a8:'bR',b8:'bN',c8:'bB',d8:'bQ',e8:'bK',f8:'bB',g8:'bN',h8:'bR',a7:'bP',b7:'bP',c7:'bP',d7:'bP',e7:'bP',f7:'bP',g7:'bP',h7:'bP'};let B={},ori='w',tool='wP',pick=null,best=null,H=[];const $=x=>document.getElementById(x),cp=o=>Object.assign({},o),file=s=>F.indexOf(s[0]),rank=s=>+s[1],sq=(f,r)=>F[f]+r,ins=(f,r)=>f>=0&&f<8&&r>0&&r<9,col=p=>p&&p[0],typ=p=>p&&p[1],opp=c=>c=='w'?'b':'w',esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function save(){H.push({B:cp(B),turn:$('turn').value});if(H.length>60)H.shift()}function undo(){let h=H.pop();if(!h){msg('Nothing to undo.');return}B=cp(h.B);$('turn').value=h.turn;pick=null;best=null;draw('Undo.')}function msg(t){$('status').innerHTML='<b>Ready.</b> '+esc(t)}function kings(b){let w=0,k=0;Object.values(b).forEach(p=>{if(p=='wK')w=1;if(p=='bK')k=1});return w&&k}function ksq(b,c){for(const s in b)if(b[s]==c+'K')return s;return null}function atk(b,t,c){let tf=file(t),tr=rank(t);for(const fr in b){let p=b[fr];if(col(p)!=c)continue;let f=file(fr),r=rank(fr),T=typ(p);if(T=='P'){let d=c=='w'?1:-1;if((f+1==tf||f-1==tf)&&r+d==tr)return 1}if(T=='N')for(const a of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])if(f+a[0]==tf&&r+a[1]==tr)return 1;if(T=='K'&&Math.max(Math.abs(f-tf),Math.abs(r-tr))==1)return 1;let ds=[];if(T=='B'||T=='Q')ds.push([1,1],[1,-1],[-1,1],[-1,-1]);if(T=='R'||T=='Q')ds.push([1,0],[-1,0],[0,1],[0,-1]);for(const d of ds){let nf=f+d[0],nr=r+d[1];while(ins(nf,nr)){let s=sq(nf,nr);if(s==t)return 1;if(b[s])break;nf+=d[0];nr+=d[1]}}}return 0}function check(b,c){let k=ksq(b,c);return !k||atk(b,k,opp(c))}function add(m,b,fr,to,pr){let p=b[fr],q=b[to];if(!p||q&&col(q)==col(p))return;m.push({from:fr,to:to,piece:typ(p),side:col(p),captured:q?typ(q):null,promotion:pr||null})}function pseudo(b,c){let m=[];for(const fr in b){let p=b[fr];if(col(p)!=c)continue;let T=typ(p),f=file(fr),r=rank(fr);if(T=='P'){let d=c=='w'?1:-1,st=c=='w'?2:7,pr=c=='w'?8:1;if(ins(f,r+d)&&!b[sq(f,r+d)]){add(m,b,fr,sq(f,r+d),r+d==pr?'Q':null);if(r==st&&!b[sq(f,r+2*d)])add(m,b,fr,sq(f,r+2*d))}for(const df of[-1,1]){let nf=f+df,nr=r+d,to=sq(nf,nr);if(ins(nf,nr)&&b[to]&&col(b[to])==opp(c))add(m,b,fr,to,nr==pr?'Q':null)}}if(T=='N')for(const a of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])if(ins(f+a[0],r+a[1]))add(m,b,fr,sq(f+a[0],r+a[1]));if(T=='K')for(let df=-1;df<=1;df++)for(let dr=-1;dr<=1;dr++)if((df||dr)&&ins(f+df,r+dr))add(m,b,fr,sq(f+df,r+dr));let ds=[];if(T=='B'||T=='Q')ds.push([1,1],[1,-1],[-1,1],[-1,-1]);if(T=='R'||T=='Q')ds.push([1,0],[-1,0],[0,1],[0,-1]);for(const d of ds){let nf=f+d[0],nr=r+d[1];while(ins(nf,nr)){let to=sq(nf,nr);if(!b[to])add(m,b,fr,to);else{if(col(b[to])==opp(c))add(m,b,fr,to);break}nf+=d[0];nr+=d[1]}}}return m}function mv(b,m){let n=cp(b),p=n[m.from];delete n[m.from];n[m.to]=m.promotion?m.side+m.promotion:p;return n}function legal(b,c){return pseudo(b,c).filter(m=>!check(mv(b,m),c))}function val(b,c){let s=0;for(const x in b){let p=b[x],v=V[typ(p)]||0;if(['d4','e4','d5','e5'].includes(x))v+=15;s+=col(p)==c?v:-v}try{s+=(legal(b,c).length-legal(b,opp(c)).length)*2}catch(e){}if(check(b,opp(c)))s+=40;if(check(b,c))s-=50;return s}function guess(m){return(m.captured?V[m.captured]+30:0)+(m.promotion?900:0)+(['d4','e4','d5','e5'].includes(m.to)?20:0)}function order(ms){return [...ms].sort((a,b)=>guess(b)-guess(a))}function search(b,c,d,a,z){let ms=legal(b,c);if(!d||!ms.length)return !ms.length?(check(b,c)?-99999:0):val(b,c);let q=-1e9;for(const m of order(ms)){let sc=-search(mv(b,m),opp(c),d-1,-z,-a);if(sc>q)q=sc;if(sc>a)a=sc;if(a>=z)break}return q}function calc(){let side=$('turn').value;if(!kings(B)){err('Place both kings first.');return}let ms=legal(B,side);if(!ms.length){err(check(B,side)?'Checkmate. No legal move.':'Stalemate. No legal move.');return}$('best').textContent='Thinking...';$('meta').textContent='Calculating one move.';$('why').textContent='Checking legal moves and replies.';setTimeout(()=>{let depth=ms.length>34?2:3,bm=null,bs=-1e9;for(const m of order(ms)){let sc=-search(mv(B,m),opp(side),depth-1,-1e9,1e9)+guess(m)/10;if(sc>bs){bs=sc;bm=m}}best=bm;draw('Best move calculated.');$('best').textContent=short(bm);$('meta').textContent=long(bm)+' · depth '+depth;$('why').innerHTML=why(bm,mv(B,bm),side)},20)}function err(t){best=null;$('best').textContent='-';$('meta').textContent=t;$('why').textContent='Adjust the board and calculate again.';draw(t)}function short(m){return(m.piece=='P'?'':m.piece)+m.from+(m.captured?'x':'-')+m.to+(m.promotion?'=Q':'')}function long(m){return({K:'King',Q:'Queen',R:'Rook',B:'Bishop',N:'Knight',P:'Pawn'}[m.piece])+(m.captured?' takes ':' to ')+m.to+(m.promotion?', promote to queen':'')}function why(m,after,side){let a=[];let reps=legal(after,opp(side));if(check(after,opp(side))&&!reps.length)a.push('It gives checkmate.');else if(check(after,opp(side)))a.push('It gives check, so the opponent has fewer replies.');if(m.captured)a.push('It wins material.');if(m.promotion)a.push('It promotes to a queen.');if(['d4','e4','d5','e5'].includes(m.to))a.push('It improves central control.');if(!a.length)a.push('It gives the best balance of material, activity, king safety and counterplay.');a.push('The app returns this single move only.');return'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}function draw(t){let el=$('board');el.innerHTML='';let rs=ori=='w'?[8,7,6,5,4,3,2,1]:[1,2,3,4,5,6,7,8],fs=ori=='w'?F:[...F].reverse();for(const r of rs)for(const fch of fs){let f=F.indexOf(fch),s=fch+r,d=document.createElement('div');d.className='sq '+(((f+r)%2)?'l':'d');d.dataset.c=(fch=='a'||fch=='h'||r==1||r==8)?s:'';if(s==pick)d.classList.add('sel');if(best&&s==best.from)d.classList.add('fr');if(best&&s==best.to)d.classList.add('to');let p=B[s];if(p){let sp=document.createElement('span');sp.className='pc '+(col(p)=='w'?'wp':'bp');sp.textContent=G[typ(p)];d.appendChild(sp)}d.onclick=()=>tap(s);el.appendChild(d)}if(t)msg(t)}function tap(s){best=null;if(pick){if(pick!=s){save();B[s]=B[pick];delete B[pick]}pick=null;draw('Piece moved.');return}if(B[s]){if(tool=='rm'){save();delete B[s];draw('Piece removed. Undo is available.');return}pick=s;draw('Piece selected. Tap destination.');return}if(tool!='rm'){save();B[s]=tool;draw('Piece placed.')}else draw('Remove mode is active. Tap an occupied square.')}function palette(){let codes=['wK','wQ','wR','wB','wN','wP','bK','bQ','bR','bB','bN','bP','rm'],el=$('pal');el.innerHTML='';codes.forEach(c=>{let bt=document.createElement('button');bt.className='pb '+(c=='rm'?'rm ':'')+(c==tool?'on':'');bt.innerHTML=c=='rm'?'Remove':'<span class="pc '+(c[0]=='w'?'wp':'bp')+'">'+G[c[1]]+'</span>';bt.onclick=()=>{tool=c;pick=null;[...el.children].forEach(x=>x.classList.remove('on'));bt.classList.add('on');draw(c=='rm'?'Remove mode selected.':'Piece selected.')};el.appendChild(bt)})}function start(){save();B=cp(START);$('turn').value='w';pick=null;best=null;draw('Starting position loaded.')}palette();$('start').onclick=start;$('empty').onclick=()=>{save();B={};pick=null;best=null;draw('Empty board. Build the current position.')};$('undo').onclick=undo;$('clearSel').onclick=()=>{pick=null;draw('Selection cleared.')};$('flip').onclick=()=>{ori=ori=='w'?'b':'w';draw('Board flipped.')};$('turn').onchange=()=>{best=null;draw(($('turn').value=='w'?'White':'Black')+' to move.')};$('calc').onclick=calc;H=[];B=cp(START);draw('Starting position loaded.')})()</script></body></html>
