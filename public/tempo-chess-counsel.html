<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tempo Chess Counsel</title>
<style>
:root{--ink:#15110d;--muted:#74675a;--line:#e5d8c7;--brown:#9b704a;--ivory:#f3ead5;--blue:#246bea;--paper:#fffdf8;--shadow:rgba(74,50,30,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 50% -120px,rgba(122,77,36,.16),transparent 310px),linear-gradient(#f8f3eb,#eee5d9);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:var(--ink)}button,select{font:inherit}.app{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 28px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.ey{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:5px}h1{font-size:32px;line-height:.98;letter-spacing:-.055em;margin:0;font-weight:900}.sub{margin:7px 0 0;color:var(--muted);font-size:14px}.ready{border:1px solid var(--line);background:#fffaf3;border-radius:999px;padding:8px 12px;height:34px;color:#6d4b2b;font-weight:800;font-size:12px}.card{background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 55px var(--shadow);overflow:hidden;margin-bottom:14px}.shell{padding:12px;background:linear-gradient(145deg,rgba(255,255,255,.4),rgba(126,82,42,.05))}#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid rgba(50,32,18,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}.sq{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1;user-select:none}.light{background:var(--ivory)}.dark{background:var(--brown)}.sq:after{content:attr(data-c);position:absolute;left:4px;bottom:3px;font-size:10px;font-weight:800;opacity:.24}.dark:after{color:#fff;opacity:.36}.pieceSvg{width:88%;height:88%;display:block;overflow:visible}.pieceSvg .body{stroke-width:4.2;stroke-linejoin:round;stroke-linecap:round}.whitePiece{color:#fff7e9;--pieceStroke:#5d3b1f;filter:drop-shadow(0 2px 1px rgba(70,43,20,.28)) drop-shadow(0 8px 9px rgba(70,43,20,.22))}.blackPiece{color:#15100c;--pieceStroke:#080604;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35)) drop-shadow(0 8px 9px rgba(0,0,0,.24))}.pieceButton .pieceSvg{width:74%;height:74%;margin:auto}.selected{box-shadow:inset 0 0 0 4px var(--blue)}.bestFrom{box-shadow:inset 0 0 0 4px rgba(20,15,10,.70)}.bestTo{box-shadow:inset 0 0 0 4px var(--blue)}.status{padding:0 15px 15px;color:var(--muted);font-size:14px}.status b{color:var(--ink)}.section{padding:16px}.label{margin:0 0 10px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:var(--muted)}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.pieceButton,.ghost,.go,select{border:1px solid var(--line);border-radius:17px;background:#fffdf8;color:var(--ink)}.pieceButton{height:52px;box-shadow:0 6px 16px rgba(70,43,20,.04);display:flex;align-items:center;justify-content:center}.pieceButton.active{border-color:#b98a5e;background:#f6ede3}.removeButton{grid-column:span 2;font-size:15px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.ghost,select{height:50px;padding:0 13px;font-weight:750;font-size:15px}.go{height:62px;width:100%;margin-top:12px;background:linear-gradient(#211913,#11100e);color:#fff;font-size:20px;font-weight:900;border-color:#17120d;box-shadow:0 12px 28px rgba(40,27,17,.16)}.resultTop{padding:18px 16px 15px;background:linear-gradient(#fbf5ec,#f4e8d8);border-bottom:1px solid var(--line)}.resultLabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#795634;font-weight:850;margin-bottom:5px}#best{font-size:48px;line-height:1;font-weight:950;margin-bottom:8px}.meta{color:var(--muted);font-size:14px}.why{padding:15px 16px 17px;font-size:15px;line-height:1.48;color:#3b332b}.why ul{margin:0;padding-left:20px}.foot{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0}@media(max-width:390px){h1{font-size:29px}.palette{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><div class="ey">premium phone prototype</div><h1>Tempo Chess Counsel</h1><p class="sub">Set the board. Tap analyze. Get one best move.</p></div><div class="ready">ready</div></div>
  <section class="card"><div class="shell"><div id="board"></div></div><div class="status" id="status"><b>Ready.</b> Tap a piece on the board to pick it up.</div></section>
  <section class="card"><div class="section"><p class="label">Set board</p><div class="palette" id="palette"></div><div class="grid"><button class="ghost" id="startButton">Starting position</button><button class="ghost" id="emptyButton">Empty board</button></div><div class="grid"><button class="ghost" id="undoButton">Undo</button><button class="ghost" id="flipButton">Flip board</button></div><div class="grid"><select id="turnSelect"><option value="w">White to move</option><option value="b">Black to move</option></select><button class="ghost" id="clearButton">Clear selection</button></div><button class="go" id="calculateButton">Calculate best move</button></div></section>
  <section class="card"><div class="resultTop"><div class="resultLabel">Best move</div><div id="best">-</div><div class="meta" id="meta">No calculation yet.</div></div><div class="why" id="why">One answer only. No move menu.</div></section>
  <div class="foot">Tap piece → tap destination. Turn switches automatically after a move.</div>
</main>
<script>
(function(){
  const VALUE={P:100,N:320,B:330,R:500,Q:900,K:0};
  const FILES=['a','b','c','d','e','f','g','h'];
  const START={a1:'wR',b1:'wN',c1:'wB',d1:'wQ',e1:'wK',f1:'wB',g1:'wN',h1:'wR',a2:'wP',b2:'wP',c2:'wP',d2:'wP',e2:'wP',f2:'wP',g2:'wP',h2:'wP',a8:'bR',b8:'bN',c8:'bB',d8:'bQ',e8:'bK',f8:'bB',g8:'bN',h8:'bR',a7:'bP',b7:'bP',c7:'bP',d7:'bP',e7:'bP',f7:'bP',g7:'bP',h7:'bP'};
  let board={},orientation='w',tool='wP',selected=null,bestMove=null,history=[];
  const $=id=>document.getElementById(id);
  const copy=o=>Object.assign({},o);
  const file=s=>FILES.indexOf(s[0]);
  const rank=s=>Number(s[1]);
  const square=(f,r)=>FILES[f]+r;
  const inside=(f,r)=>f>=0&&f<8&&r>0&&r<9;
  const color=p=>p&&p[0];
  const type=p=>p&&p[1];
  const opposite=c=>c==='w'?'b':'w';
  const escapeHtml=s=>String(s).replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
  function pieceSvg(code){const side=code[0],t=code[1],cls=side==='w'?'whitePiece':'blackPiece';const common='<ellipse class="body" cx="50" cy="83" rx="31" ry="7" fill="currentColor" stroke="var(--pieceStroke)"/><rect class="body" x="24" y="71" width="52" height="10" rx="4" fill="currentColor" stroke="var(--pieceStroke)"/>';let mid='';if(t==='P')mid='<circle class="body" cx="50" cy="27" r="13" fill="currentColor" stroke="var(--pieceStroke)"/><path class="body" d="M36 70 C38 55 42 43 50 42 C58 43 62 55 64 70 Z" fill="currentColor" stroke="var(--pieceStroke)"/>';if(t==='R')mid='<path class="body" d="M28 25 H72 V39 H66 V68 H34 V39 H28 Z" fill="currentColor" stroke="var(--pieceStroke)"/><path d="M30 22 V34 M42 22 V34 M58 22 V34 M70 22 V34" stroke="var(--pieceStroke)" stroke-width="8" stroke-linecap="round"/>';if(t==='N')mid='<path class="body" d="M33 70 C34 58 41 49 46 42 C40 39 37 35 39 29 C45 33 53 31 60 25 C70 34 70 47 61 56 L68 70 Z" fill="currentColor" stroke="var(--pieceStroke)"/><circle cx="57" cy="37" r="2.8" fill="var(--pieceStroke)"/>';if(t==='B')mid='<circle class="body" cx="50" cy="23" r="7" fill="currentColor" stroke="var(--pieceStroke)"/><path class="body" d="M34 70 C35 48 43 33 50 30 C57 33 65 48 66 70 Z" fill="currentColor" stroke="var(--pieceStroke)"/><path d="M56 39 L45 55" stroke="var(--pieceStroke)" stroke-width="5" stroke-linecap="round"/>';if(t==='Q')mid='<path class="body" d="M27 70 L34 31 L45 52 L50 27 L55 52 L66 31 L73 70 Z" fill="currentColor" stroke="var(--pieceStroke)"/><circle cx="34" cy="27" r="6" fill="currentColor" stroke="var(--pieceStroke)" stroke-width="4"/><circle cx="50" cy="23" r="6" fill="currentColor" stroke="var(--pieceStroke)" stroke-width="4"/><circle cx="66" cy="27" r="6" fill="currentColor" stroke="var(--pieceStroke)" stroke-width="4"/>';if(t==='K')mid='<path class="body" d="M34 70 C35 52 41 41 50 36 C59 41 65 52 66 70 Z" fill="currentColor" stroke="var(--pieceStroke)"/><path d="M50 18 V41 M39 29 H61" stroke="var(--pieceStroke)" stroke-width="7" stroke-linecap="round"/>';return '<svg class="pieceSvg '+cls+'" viewBox="0 0 100 100" aria-hidden="true">'+mid+common+'</svg>'}
  function save(){history.push({board:copy(board),turn:$('turnSelect').value});if(history.length>60)history.shift()}
  function undo(){const h=history.pop();if(!h){message('Nothing to undo.');return}board=copy(h.board);$('turnSelect').value=h.turn;selected=null;bestMove=null;render('Undo.')}
  function switchTurn(){const next=opposite($('turnSelect').value);$('turnSelect').value=next;return next==='w'?'White':'Black'}
  function message(text){$('status').innerHTML='<b>Ready.</b> '+escapeHtml(text)}
  function hasKings(b){let w=false,bl=false;Object.values(b).forEach(p=>{if(p==='wK')w=true;if(p==='bK')bl=true});return w&&bl}
  function kingSquare(b,side){for(const s in b){if(b[s]===side+'K')return s}return null}
  function attacked(b,target,side){const tf=file(target),tr=rank(target);for(const from in b){const p=b[from];if(color(p)!==side)continue;const f=file(from),r=rank(from),t=type(p);if(t==='P'){const d=side==='w'?1:-1;if((f+1===tf||f-1===tf)&&r+d===tr)return true}if(t==='N'){for(const a of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])if(f+a[0]===tf&&r+a[1]===tr)return true}if(t==='K'&&Math.max(Math.abs(f-tf),Math.abs(r-tr))===1)return true;const dirs=[];if(t==='B'||t==='Q')dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);if(t==='R'||t==='Q')dirs.push([1,0],[-1,0],[0,1],[0,-1]);for(const d of dirs){let nf=f+d[0],nr=r+d[1];while(inside(nf,nr)){const s=square(nf,nr);if(s===target)return true;if(b[s])break;nf+=d[0];nr+=d[1]}}}return false}
  function inCheck(b,side){const k=kingSquare(b,side);return !k||attacked(b,k,opposite(side))}
  function addMove(list,b,from,to,promo){const p=b[from],q=b[to];if(!p||(q&&color(q)===color(p)))return;list.push({from,to,piece:type(p),side:color(p),captured:q?type(q):null,promotion:promo||null})}
  function pseudoMoves(b,side){const moves=[];for(const from in b){const p=b[from];if(color(p)!==side)continue;const t=type(p),f=file(from),r=rank(from);if(t==='P'){const d=side==='w'?1:-1,start=side==='w'?2:7,promo=side==='w'?8:1;if(inside(f,r+d)&&!b[square(f,r+d)]){addMove(moves,b,from,square(f,r+d),r+d===promo?'Q':null);if(r===start&&!b[square(f,r+2*d)])addMove(moves,b,from,square(f,r+2*d))}for(const df of[-1,1]){const nf=f+df,nr=r+d,to=square(nf,nr);if(inside(nf,nr)&&b[to]&&color(b[to])===opposite(side))addMove(moves,b,from,to,nr===promo?'Q':null)}}if(t==='N'){for(const a of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])if(inside(f+a[0],r+a[1]))addMove(moves,b,from,square(f+a[0],r+a[1]))}if(t==='K'){for(let df=-1;df<=1;df++)for(let dr=-1;dr<=1;dr++)if((df||dr)&&inside(f+df,r+dr))addMove(moves,b,from,square(f+df,r+dr))}const dirs=[];if(t==='B'||t==='Q')dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);if(t==='R'||t==='Q')dirs.push([1,0],[-1,0],[0,1],[0,-1]);for(const d of dirs){let nf=f+d[0],nr=r+d[1];while(inside(nf,nr)){const to=square(nf,nr);if(!b[to])addMove(moves,b,from,to);else{if(color(b[to])===opposite(side))addMove(moves,b,from,to);break}nf+=d[0];nr+=d[1]}}}return moves}
  function makeMove(b,m){const n=copy(b),p=n[m.from];delete n[m.from];n[m.to]=m.promotion?m.side+m.promotion:p;return n}
  function legalMoves(b,side){return pseudoMoves(b,side).filter(m=>!inCheck(makeMove(b,m),side))}
  function evaluate(b,side){let score=0;for(const s in b){const p=b[s];let v=VALUE[type(p)]||0;if(['d4','e4','d5','e5'].includes(s))v+=15;score+=color(p)===side?v:-v}try{score+=(legalMoves(b,side).length-legalMoves(b,opposite(side)).length)*2}catch(e){}if(inCheck(b,opposite(side)))score+=40;if(inCheck(b,side))score-=50;return score}
  function moveGuess(m){return(m.captured?VALUE[m.captured]+30:0)+(m.promotion?900:0)+(['d4','e4','d5','e5'].includes(m.to)?20:0)}
  function ordered(ms){return[...ms].sort((a,b)=>moveGuess(b)-moveGuess(a))}
  function search(b,side,depth,alpha,beta){const moves=legalMoves(b,side);if(depth===0||!moves.length)return !moves.length?(inCheck(b,side)?-99999:0):evaluate(b,side);let best=-1e9;for(const m of ordered(moves)){const sc=-search(makeMove(b,m),opposite(side),depth-1,-beta,-alpha);if(sc>best)best=sc;if(sc>alpha)alpha=sc;if(alpha>=beta)break}return best}
  function calculate(){const side=$('turnSelect').value;if(!hasKings(board)){showError('Place both kings first.');return}const moves=legalMoves(board,side);if(!moves.length){showError(inCheck(board,side)?'Checkmate. No legal move.':'Stalemate. No legal move.');return}$('best').textContent='Thinking...';$('meta').textContent='Calculating one move.';$('why').textContent='Checking legal moves and replies.';setTimeout(()=>{const depth=moves.length>34?2:3;let chosen=null,bestScore=-1e9;for(const m of ordered(moves)){const sc=-search(makeMove(board,m),opposite(side),depth-1,-1e9,1e9)+moveGuess(m)/10;if(sc>bestScore){bestScore=sc;chosen=m}}bestMove=chosen;render('Best move calculated.');$('best').textContent=shortMove(chosen);$('meta').textContent=longMove(chosen)+' · depth '+depth;$('why').innerHTML=explain(chosen,makeMove(board,chosen),side)},20)}
  function showError(t){bestMove=null;$('best').textContent='-';$('meta').textContent=t;$('why').textContent='Adjust the board and calculate again.';render(t)}
  function shortMove(m){return(m.piece==='P'?'':m.piece)+m.from+(m.captured?'x':'-')+m.to+(m.promotion?'=Q':'')}
  function longMove(m){return({K:'King',Q:'Queen',R:'Rook',B:'Bishop',N:'Knight',P:'Pawn'}[m.piece])+(m.captured?' takes ':' to ')+m.to+(m.promotion?', promote to queen':'')}
  function explain(m,after,side){const a=[];const replies=legalMoves(after,opposite(side));if(inCheck(after,opposite(side))&&!replies.length)a.push('It gives checkmate.');else if(inCheck(after,opposite(side)))a.push('It gives check, so the opponent has fewer replies.');if(m.captured)a.push('It wins material.');if(m.promotion)a.push('It promotes to a queen.');if(['d4','e4','d5','e5'].includes(m.to))a.push('It improves central control.');if(!a.length)a.push('It gives the best balance of material, activity, king safety and counterplay.');a.push('The app returns this single move only.');return'<ul>'+a.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul>'}
  function render(text){const el=$('board');el.innerHTML='';const ranks=orientation==='w'?[8,7,6,5,4,3,2,1]:[1,2,3,4,5,6,7,8];const files=orientation==='w'?FILES:[...FILES].reverse();for(const r of ranks){for(const fch of files){const f=FILES.indexOf(fch),s=fch+r,d=document.createElement('div');d.className='sq '+(((f+r)%2)?'light':'dark');d.dataset.c=(fch==='a'||fch==='h'||r===1||r===8)?s:'';if(s===selected)d.classList.add('selected');if(bestMove&&s===bestMove.from)d.classList.add('bestFrom');if(bestMove&&s===bestMove.to)d.classList.add('bestTo');const p=board[s];if(p)d.innerHTML=pieceSvg(p);d.onclick=()=>tap(s);el.appendChild(d)}}if(text)message(text)}
  function tap(s){bestMove=null;if(selected){if(selected!==s){save();board[s]=board[selected];delete board[selected];const next=switchTurn();selected=null;render('Piece moved. '+next+' to move.');return}selected=null;render('Selection cleared.');return}if(board[s]){if(tool==='remove'){save();delete board[s];render('Piece removed. Undo is available.');return}selected=s;render('Piece selected. Tap destination.');return}if(tool!=='remove'){save();board[s]=tool;render('Piece placed.')}else render('Remove mode is active. Tap an occupied square.')}
  function buildPalette(){const codes=['wK','wQ','wR','wB','wN','wP','bK','bQ','bR','bB','bN','bP','remove'];const el=$('palette');el.innerHTML='';codes.forEach(c=>{const button=document.createElement('button');button.className='pieceButton '+(c==='remove'?'removeButton ':'')+(c===tool?'active':'');button.innerHTML=c==='remove'?'Remove':pieceSvg(c);button.onclick=()=>{tool=c;selected=null;[...el.children].forEach(x=>x.classList.remove('active'));button.classList.add('active');render(c==='remove'?'Remove mode selected.':'Piece selected.')};el.appendChild(button)})}
  function start(){save();board=copy(START);$('turnSelect').value='w';selected=null;bestMove=null;render('Starting position loaded.')}
  buildPalette();
  $('startButton').onclick=start;
  $('emptyButton').onclick=()=>{save();board={};selected=null;bestMove=null;render('Empty board. Build the current position.')};
  $('undoButton').onclick=undo;
  $('clearButton').onclick=()=>{selected=null;render('Selection cleared.')};
  $('flipButton').onclick=()=>{orientation=orientation==='w'?'b':'w';render('Board flipped.')};
  $('turnSelect').onchange=()=>{bestMove=null;render(($('turnSelect').value==='w'?'White':'Black')+' to move.')};
  $('calculateButton').onclick=calculate;
  history=[];board=copy(START);render('Starting position loaded.');
})();
</script>
</body>
</html>
